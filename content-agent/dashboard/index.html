<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kirti Pandey — Content Command Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent: #6C47FF;
      --accent-light: rgba(108, 71, 255, 0.12);
      --bg: #f5f5f7;
      --card-bg: #fff;
      --text: #111;
      --text-muted: #666;
      --border: #eee;
      --green: #2e7d32;
      --green-bg: #e8f5e9;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* HEADER */
    .header {
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 32px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 16px rgba(108,71,255,0.25);
    }
    .header-left {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .header-right {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.85;
    }

    /* TABS */
    .tabs-bar {
      background: #fff;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 32px;
      gap: 4px;
    }
    .tab-btn {
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      padding: 16px 20px 13px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
      white-space: nowrap;
    }
    .tab-btn:hover { color: var(--accent); }
    .tab-btn.active {
      border-bottom: 3px solid var(--accent);
      color: var(--accent);
      font-weight: 600;
    }

    /* MAIN CONTENT */
    .main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 24px 0;
    }

    /* STAT CARDS ROW */
    .stat-cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 28px;
    }
    .stat-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 22px 24px;
      border-top: 3px solid var(--accent);
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    .stat-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 10px;
    }
    .stat-value {
      font-size: 30px;
      font-weight: 700;
      color: var(--text);
      line-height: 1;
      margin-bottom: 4px;
    }
    .stat-sub {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .stat-sub-accent {
      font-size: 12px;
      color: var(--accent);
      font-weight: 600;
      margin-top: 4px;
    }

    /* SECTION TITLE */
    .section-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 16px;
      margin-top: 4px;
    }

    /* TABLE */
    .data-table-wrap {
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      overflow: hidden;
      margin-bottom: 28px;
    }
    .data-table {
      width: 100%;
      border-collapse: collapse;
    }
    .data-table thead th {
      background: #fafafa;
      padding: 13px 16px;
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
    }
    .data-table tbody tr:nth-child(odd) { background: #fafafa; }
    .data-table tbody tr:nth-child(even) { background: #fff; }
    .data-table tbody tr:hover { background: #f0eeff; transition: background 0.1s; }
    .data-table tbody td {
      padding: 12px 16px;
      font-size: 13px;
      color: var(--text);
      border-bottom: 1px solid #f0f0f0;
      vertical-align: middle;
    }
    .data-table tbody tr:last-child td { border-bottom: none; }
    .thumb {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 6px;
      display: block;
      background: #e8e0ff;
    }
    .thumb-placeholder {
      width: 60px;
      height: 60px;
      border-radius: 6px;
      background: var(--accent-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }
    .visit-btn {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 20px;
      text-decoration: none;
      letter-spacing: 0.5px;
      white-space: nowrap;
      transition: opacity 0.15s;
    }
    .visit-btn:hover { opacity: 0.85; }
    .platform-badge {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .badge-ig { background: #fce4ec; color: #c2185b; }
    .badge-yt { background: #ffebee; color: #c62828; }
    .badge-fb { background: #e3f2fd; color: #1565c0; }

    /* BAR CHART */
    .bar-chart-wrap {
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      padding: 24px;
      margin-bottom: 28px;
    }
    .bar-chart-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 18px;
    }
    .bar-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .bar-row:last-child { margin-bottom: 0; }
    .bar-label {
      width: 180px;
      min-width: 120px;
      flex-shrink: 0;
      font-size: 12px;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .bar-track {
      flex: 1;
      height: 22px;
      background: var(--accent-light);
      border-radius: 4px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 4px;
      transition: width 0.4s ease;
    }
    .bar-value {
      width: 80px;
      text-align: right;
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      flex-shrink: 0;
    }

    /* AGENT CARDS SECTION */
    .agents-section {
      padding: 32px 24px 40px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .agents-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
    }
    .agents-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 24px;
    }
    .agents-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 20px;
    }
    .agent-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      border-top: 3px solid var(--accent);
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      cursor: pointer;
      transition: box-shadow 0.15s, transform 0.15s;
      user-select: none;
    }
    .agent-card:hover {
      box-shadow: 0 4px 24px rgba(108,71,255,0.18);
      transform: translateY(-2px);
    }
    .agent-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .agent-icon { font-size: 22px; line-height: 1; }
    .agent-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      flex: 1;
    }
    .active-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      background: var(--green-bg);
      color: var(--green);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 3px 8px;
      border-radius: 10px;
      margin-bottom: 12px;
      width: fit-content;
    }
    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse 1.8s ease-in-out infinite;
      flex-shrink: 0;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .agent-metrics {
      margin-bottom: 12px;
    }
    .agent-metric {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 3px;
      line-height: 1.5;
    }
    .agent-metric strong {
      color: var(--text);
      font-weight: 600;
    }
    .agent-expand {
      display: none;
      margin-top: 12px;
      border-top: 1px solid var(--border);
      padding-top: 12px;
    }
    .agent-card.expanded .agent-expand { display: block; }
    .agent-desc {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 12px;
    }
    .agent-output-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .agent-output-box {
      background: #fafafa;
      border: 1px dashed var(--border);
      border-radius: 6px;
      padding: 10px;
      font-size: 11px;
      color: #bbb;
      font-style: italic;
      min-height: 48px;
    }

    /* DIVIDER */
    .agents-divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 8px 0 0;
    }

    /* RESPONSIVE */
    @media (max-width: 640px) {
      .header { padding: 14px 16px; }
      .header-left { font-size: 16px; }
      .header-right { font-size: 10px; }
      .tabs-bar { padding: 0 8px; gap: 0; }
      .tab-btn { padding: 14px 12px 11px; font-size: 13px; }
      .main { padding: 20px 12px 0; }
      .agents-section { padding: 24px 12px 32px; }
      .bar-label { width: 100px; min-width: 80px; }
      .bar-value { width: 60px; }
      .data-table { font-size: 12px; }
    }
  </style>
</head>

// =========================================================
// UTILITIES
// =========================================================
function fmtNum(n) {
  if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
  if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
  return n.toLocaleString();
}
function truncate(str, len) {
  if (!str) return '(no caption)';
  str = str.replace(/\n/g, ' ').trim();
  return str.length > len ? str.slice(0, len) + '…' : str;
}
function formatDate(ts) {
  if (!ts) return '—';
  const d = new Date(ts);
  if (isNaN(d)) return ts;
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}
function extractYtId(url) {
  const m = url.match(/[?&]v=([^&]+)/);
  return m ? m[1] : null;
}

// =========================================================
// RENDER HELPERS
// =========================================================
function makeStatCard(label, value, sub, subClass) {
  return `<div class="stat-card">
    <div class="stat-label">${label}</div>
    <div class="stat-value">${value}</div>
    <div class="${subClass || 'stat-sub'}">${sub || ''}</div>
  </div>`;
}

function makeBarChart(title, items, labelKey, valueKey, unit) {
  const max = Math.max(...items.map(i => i[valueKey]));
  const rows = items.map(item => {
    const pct = max > 0 ? (item[valueKey] / max * 100).toFixed(1) : 0;
    return `<div class="bar-row">
      <div class="bar-label" title="${item[labelKey]}">${truncate(item[labelKey], 28)}</div>
      <div class="bar-track">
        <div class="bar-fill" style="width:${pct}%"></div>
      </div>
      <div class="bar-value">${fmtNum(item[valueKey])}${unit || ''}</div>
    </div>`;
  }).join('');
  return `<div class="bar-chart-wrap">
    <div class="bar-chart-title">${title}</div>
    ${rows}
  </div>`;
}

function renderAllPlatforms() {
  // Stat cards
  const cards = [
    makeStatCard('Total Followers', fmtNum(DATA.crossPlatform.totalFollowers), '14,645 IG &bull; 31 YT &bull; 118 FB'),
    makeStatCard('Total Content Pieces', fmtNum(DATA.crossPlatform.totalContentPieces), '227 IG &bull; 18 YT &bull; 65 FB'),
    makeStatCard('Best Platform', 'Instagram', '2.69% engagement rate', 'stat-sub-accent')
  ];

  // Build cross-platform list
  const igPosts = DATA.myAccount.posts.slice(0, 10).map(p => ({
    platform: 'Instagram',
    badge: '<span class="platform-badge badge-ig">IG</span>',
    title: truncate(p.caption || '(no caption)', 60),
    engagement: p.likes + p.comments,
    engLabel: fmtNum(p.likes + p.comments) + ' engagements',
    date: formatDate(p.timestamp),
    link: p.permalink
  }));
  const ytPosts = DATA.youtube.topVideos.slice(0, 10).map(v => ({
    platform: 'YouTube',
    badge: '<span class="platform-badge badge-yt">YT</span>',
    title: truncate(v.title, 60),
    engagement: v.views,
    engLabel: fmtNum(v.views) + ' views',
    date: formatDate(v.published),
    link: v.url
  }));
  const fbPosts = DATA.facebook.topPosts.slice(0, 5).map(p => ({
    platform: 'Facebook',
    badge: '<span class="platform-badge badge-fb">FB</span>',
    title: truncate(p.caption, 60),
    engagement: p.impressions,
    engLabel: fmtNum(p.impressions) + ' impressions',
    date: p.date || '—',
    link: null
  }));

  const allPosts = [...igPosts, ...ytPosts, ...fbPosts]
    .sort((a, b) => b.engagement - a.engagement)
    .slice(0, 10);

  const tableRows = allPosts.map((item, i) => `
    <tr>
      <td>${item.badge}</td>
      <td style="max-width:280px;">${item.title}</td>
      <td><strong>${item.engLabel}</strong></td>
      <td>${item.date}</td>
      <td>${item.link ? `<a href="${item.link}" target="_blank" rel="noopener" class="visit-btn">Visit</a>` : '—'}</td>
    </tr>`).join('');

  return `
    <div class="stat-cards">${cards.join('')}</div>
    <div class="section-title">Top Content Across Platforms</div>
    <div class="data-table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th>Platform</th>
            <th>Title / Caption</th>
            <th>Engagement</th>
            <th>Date</th>
            <th>Link</th>
          </tr>
        </thead>
        <tbody>${tableRows}</tbody>
      </table>
    </div>`;
}

  instagram: renderInstagram,
  youtube: renderYoutube,
  facebook: renderFacebook
};

let currentTab = 'all';

function switchTab(tab) {
  currentTab = tab;
  // Update tab button styles
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tab === tab);
  });
  // Render content
  const content = document.getElementById('tab-content');
  content.innerHTML = RENDERERS[tab]();
}
